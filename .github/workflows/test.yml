name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pytest --cov=backend/painter --cov-report=term-missing
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-random-secret-key-that-is-longer-than-fifty-characters-123456
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_SSL_REDIRECT: 'true'
          DJANGO_SESSION_COOKIE_SECURE: 'true'
          DJANGO_CSRF_COOKIE_SECURE: 'true'
          DJANGO_SECURE_HSTS_SECONDS: '31536000'
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_SECURE_HSTS_PRELOAD: 'true'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check backend
      - run: ruff format --check backend
